# ============================================================
#  第二大脑 · Streamlit 站点
#  放置位置：/etc/nginx/conf.d/caojinwen.cn.conf
#  上游：127.0.0.1:8501（由 deploy/secondbrain.service 提供）
#
#  备案说明：公安备案回执里「主域名 caojinwen.cn，从域名 无」，
#  所以统一用主域名做入口，www 一律 301 跳过去。
#
#  签证书：certbot --nginx -d caojinwen.cn -d www.caojinwen.cn
# ============================================================

# www → 主域名（保留协议，http 跳 http、https 跳 https）
server {
    listen      80;
    listen      [::]:80;
    server_name www.caojinwen.cn;

    return 301 $scheme://caojinwen.cn$request_uri;
}

server {
    listen      80;
    listen      [::]:80;
    server_name caojinwen.cn;

    access_log /var/log/nginx/caojinwen.access.log;
    error_log  /var/log/nginx/caojinwen.error.log;

    # 媒体上传：Streamlit 默认上限 200MB
    client_max_body_size 200m;

    # Let's Encrypt 域名验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Streamlit 靠 WebSocket 推送界面，这几行少了会「页面能开但一直转圈」
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 一次问答可能等很久；长连接不能断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }
}

