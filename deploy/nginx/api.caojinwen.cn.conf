# ============================================================
#  第二大脑 · REST / MCP 接口
#  放置位置：/etc/nginx/conf.d/api.caojinwen.cn.conf
#  上游：127.0.0.1:8000（deploy/secondbrain-api.service）
#
#  注意：改由这里反代之后，安全组要把 8000 关掉，
#       否则「IP:8000」仍然绕过 Nginx 直接暴露。
# ============================================================

server {
    listen      80;
    listen      [::]:80;
    server_name api.caojinwen.cn;

    access_log /var/log/nginx/caojinwen-api.access.log;
    error_log  /var/log/nginx/caojinwen-api.error.log;

    # 接口请求体不需要很大
    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # MCP 的 Streamable HTTP / SSE 不能被缓冲，否则客户端收不到流
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
