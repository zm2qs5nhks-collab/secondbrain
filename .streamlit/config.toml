[global]
developmentMode = false

[theme]
base = "light"
primaryColor = "#2f5d8f"
backgroundColor = "#fbf5e9"
secondaryBackgroundColor = "#f6eeda"
textColor = "#3b3226"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
